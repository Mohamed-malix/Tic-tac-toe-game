<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-to Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="main.js" defer></script>
</head>
<body>

 <div class="background">


    <div class="game-board">
        <div class="span-group">
            <span class="board span1"></span>
            <span class="board span2"></span>
            <span class="board span3"></span>
        </div>
        <div class="span-group">
            <span class="board span4"></span>
            <span class="board span5"></span>
            <span class="board span6"></span>
        </div>
        <div class="span-group">
            <span class="board span7"></span>
            <span class="board span8"></span>
            <span class="board span9"></span>
        </div>
    </div>

    <div class=" footer">
        <button class="clear btn">Clear</button>
        <div class="gameStatus">
            <div class="player"></div>
            <div class="tie"></div>
         <div class="computer"></div>
        </div>
    </div>

  </div>
</body>
</html>
